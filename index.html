<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>WebGPU Template</title>
		<meta name="color-scheme" content="dark light" />
	</head>
	<body>
		<div id="wrapper">
			<div id="console">
				<div class="screen">
					<div id="game-wrapper">
						<canvas id="game" tabindex="0"></canvas>
						<canvas id="text"></canvas>
					</div>
				</div>
				<div id="brand-and-name">
					<span class="brand">Nitenode</span>
					<span class="name">Ugly Giant</span>
					<span class="tm">TM</span>
				</div>
				<div id="buttons">
					<div id="dpad">
						<div class="dpad-button" id="dpad-up"></div>
						<div class="dpad-button" id="dpad-left"></div>
						<div class="dpad-button" id="dpad-center"></div>
						<div class="dpad-button" id="dpad-right"></div>
						<div class="dpad-button" id="dpad-down"></div>
					</div>
					<div class="start-select" id="select-button"></div>
					<div class="start-select" id="start-button"></div>
					<div id="a-b-buttons">
						<div id="a-button" class="a-b-button"></div>
						<div id="b-button" class="a-b-button"></div>
					</div>
				</div>
			</div>
			<div id="render-passes"></div>
		</div>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
