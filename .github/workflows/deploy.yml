name: Deploy to GitHub Pages and itch.io

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

env:
    ITCH_USERNAME: brethudson
    ITCH_GAME_ID: battle-ii

jobs:
    build:
        name: Build project
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            # - run: pnpm lint
            # - run: pnpm test
            - run: pnpm build

            - uses: actions/upload-artifact@v4
              with:
                  name: dist-artifact
                  path: ./dist

            # Needs the pages: write permission granted above -- it calls the
            # Pages API to confirm the repo's Pages settings, not just read them.
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    deploy-gh:
        needs: build
        name: Upload to GitHub Pages
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4

    deploy-itch:
        needs: build
        name: Upload to itch.io
        runs-on: ubuntu-latest
        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: dist-artifact
                  path: ./dist

            - name: Publish to itch.io
              uses: KikimoraGames/itch-publish@v0.0.3
              with:
                  butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
                  gameData: ./dist
                  itchUsername: ${{ env.ITCH_USERNAME }}
                  itchGameId: ${{ env.ITCH_GAME_ID }}
                  buildChannel: html5
                  buildNumber: ${{ github.run_number }}
